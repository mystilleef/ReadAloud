# .github/workflows/test-auth.yml

# Proves Workload Identity Federation reaches the store without a key:
# mints a service account token and reads the item; never uploads or
# publishes.

name: Test Chrome Web Store auth

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/164998752727/locations/global/workloadIdentityPools/github-pool/providers/readaloud
          service_account: speakout-webstore-deployment@readaloud-377407.iam.gserviceaccount.com

      - name: Create service account config
        run: |
          mkdir -p secrets
          cat > secrets/service-account-config.json <<EOF
          {
            "type": "service_account",
            "publisherId": "${{ secrets.CHROME_PUBLISHER_ID }}",
            "extensionId": "${{ secrets.CHROME_EXTENSION_ID }}"
          }
          EOF

      - name: Verify authentication and store access
        run: npm run test-auth

      - name: Clean up secrets
        if: always()
        run: rm -rf secrets/
